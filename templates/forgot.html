<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Screening Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <div class="text-center mb-7">
    <div class="mx-auto w-14 h-14 rounded-2xl bg-blue-600/15 border border-blue-500/30 flex items-center justify-center text-2xl mb-4">🔑</div>
    <h1 id="title" class="text-2xl font-bold text-white">Reset your password</h1>
    <p id="subtitle" class="text-gray-400 text-sm mt-1">We'll email you a 6-digit code.</p>
  </div>

  <div class="bg-gray-900 rounded-2xl p-7 shadow-2xl border border-gray-800">

    <!-- progress -->
    <ol class="flex items-center mb-6" aria-label="Progress">
      <li class="flex items-center flex-1"><span id="dot1" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">1</span><span id="bar1" class="flex-1 h-0.5 mx-2"></span></li>
      <li class="flex items-center flex-1"><span id="dot2" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">2</span><span id="bar2" class="flex-1 h-0.5 mx-2"></span></li>
      <li class="flex items-center"><span id="dot3" class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold">3</span></li>
    </ol>

    <div id="message" class="hidden mb-4 p-3 rounded-lg text-sm font-medium" role="alert"></div>

    <!-- Step 1: email -->
    <form id="form1" class="space-y-4" novalidate>
      <div>
        <label for="email" class="text-gray-300 text-sm font-medium block mb-1">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="your@email.com" autofocus
          class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-3
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
        <p class="text-gray-500 text-xs mt-1">Use the email you registered with.</p>
      </div>
      <button id="btn1" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-3 rounded-lg transition">
        Send code
      </button>
    </form>

    <!-- Step 2: OTP -->
    <form id="form2" class="hidden space-y-4" novalidate>
      <p id="sent_note" class="text-sm text-gray-300"></p>
      <div>
        <label for="otp" class="text-gray-300 text-sm font-medium block mb-1">6-digit code</label>
        <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"
          class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-3 text-center text-2xl tracking-[0.5em] font-mono
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
      </div>
      <button id="btn2" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-3 rounded-lg transition">
        Verify code
      </button>
      <div class="flex justify-between text-sm">
        <button type="button" id="back2" class="text-gray-400 hover:text-white">← Change email</button>
        <button type="button" id="resend" class="text-blue-400 hover:underline disabled:text-gray-600 disabled:no-underline" disabled>Resend code</button>
      </div>
    </form>

    <!-- Step 3: new password -->
    <form id="form3" class="hidden space-y-4" novalidate>
      <div>
        <label for="new_password" class="text-gray-300 text-sm font-medium block mb-1">New password</label>
        <div class="relative">
          <input id="new_password" type="password" autocomplete="new-password" placeholder="Min 8 chars, 1 uppercase, 1 number"
            class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-4 pr-12 py-3
                   focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
          <button type="button" data-eye="new_password" aria-label="Show password" aria-pressed="false"
            class="eye absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white"></button>
        </div>
        <ul class="mt-2 space-y-0.5 text-xs" id="rules">
          <li id="r_len">At least 8 characters</li>
          <li id="r_up">One uppercase letter</li>
          <li id="r_num">One number</li>
        </ul>
      </div>
      <div>
        <label for="confirm_password" class="text-gray-300 text-sm font-medium block mb-1">Confirm new password</label>
        <div class="relative">
          <input id="confirm_password" type="password" autocomplete="new-password" placeholder="Repeat your new password"
            class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-4 pr-12 py-3
                   focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
          <button type="button" data-eye="confirm_password" aria-label="Show password" aria-pressed="false"
            class="eye absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white"></button>
        </div>
      </div>
      <button id="btn3" type="submit" class="w-full bg-green-600 hover:bg-green-700 disabled:opacity-60 text-white font-semibold py-3 rounded-lg transition">
        Reset password
      </button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-6">
      <a href="/" class="text-blue-400 hover:underline">← Back to sign in</a>
    </p>
  </div>
</div>

<script>
const API = 'https://screening-platform-tpku.onrender.com';
let step = 1, email = '', otp = '', resendTimer = null;

const TITLES = {
  1: ['Reset your password', "We'll email you a 6-digit code."],
  2: ['Check your email', 'Enter the code we sent you.'],
  3: ['Choose a new password', 'Almost done.'],
};

const EYE_ON  = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1 1 0 0 1 0-.64C3.42 7.5 7.36 4.5 12 4.5s8.58 3 9.96 7.18a1 1 0 0 1 0 .64C20.58 16.5 16.64 19.5 12 19.5s-8.58-3-9.96-7.18Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>';
const EYE_OFF = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.22A10.5 10.5 0 0 0 2.04 12c1.38 4.18 5.32 7.5 9.96 7.5 1.7 0 3.3-.44 4.7-1.22M6.23 6.23A10.45 10.45 0 0 1 12 4.5c4.64 0 8.58 3.32 9.96 7.5a10.5 10.5 0 0 1-4.29 5.23M6.23 6.23 3 3m3.23 3.23 3.65 3.65m7.89 7.89L21 21m-3.23-3.23-3.65-3.65m0 0a3 3 0 1 0-4.24-4.24m4.24 4.24L9.88 9.88"/></svg>';

// ── helpers ────────────────────────────────────────────────────
function errorMessage(error, fallback) {
  const d = error && error.detail;
  if (typeof d === 'string' && d) return d;
  if (Array.isArray(d) && d.length) return d.map(e => (e && e.msg) ? String(e.msg).replace(/^Value error, /, '') : JSON.stringify(e)).join('; ');
  if (d && typeof d === 'object') return d.msg || d.message || JSON.stringify(d);
  if (error && error.message) return error.message;
  return fallback;
}
function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className = 'mb-4 p-3 rounded-lg text-sm font-medium ' +
    (type === 'error' ? 'bg-red-900/70 text-red-200' : type === 'success' ? 'bg-green-900/70 text-green-200' : 'bg-blue-900/70 text-blue-200');
}
function hideMessage() { document.getElementById('message').className = 'hidden'; }

async function call(path, body) {
  const res = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

function setStep(n) {
  step = n;
  [1, 2, 3].forEach(i => {
    document.getElementById('form' + i).classList.toggle('hidden', i !== n);
    const dot = document.getElementById('dot' + i);
    dot.className = 'w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ' +
      (i < n ? 'bg-green-600 text-white' : i === n ? 'bg-blue-600 text-white ring-4 ring-blue-600/25' : 'bg-gray-800 text-gray-500');
    dot.textContent = i < n ? '✓' : String(i);
  });
  document.getElementById('bar1').className = 'flex-1 h-0.5 mx-2 ' + (n > 1 ? 'bg-green-600' : 'bg-gray-800');
  document.getElementById('bar2').className = 'flex-1 h-0.5 mx-2 ' + (n > 2 ? 'bg-green-600' : 'bg-gray-800');
  document.getElementById('title').textContent = TITLES[n][0];
  document.getElementById('subtitle').textContent = TITLES[n][1];
  hideMessage();
  const focus = { 1: 'email', 2: 'otp', 3: 'new_password' }[n];
  document.getElementById(focus).focus();
}

function startResendCooldown(seconds = 30) {
  const btn = document.getElementById('resend');
  clearInterval(resendTimer);
  let left = seconds;
  btn.disabled = true;
  btn.textContent = `Resend in ${left}s`;
  resendTimer = setInterval(() => {
    left--;
    if (left <= 0) { clearInterval(resendTimer); btn.disabled = false; btn.textContent = 'Resend code'; }
    else btn.textContent = `Resend in ${left}s`;
  }, 1000);
}

// ── step 1: request code ───────────────────────────────────────
async function requestCode(isResend = false) {
  const value = document.getElementById('email').value.trim();
  if (!/^\S+@\S+\.\S+$/.test(value)) { showMessage('Please enter a valid email address', 'error'); return; }
  const btn = document.getElementById('btn1'), resend = document.getElementById('resend');
  btn.disabled = true;
  try {
    const r = await call('/auth/forgot-password', { email: value });
    if (!r.ok) { showMessage('❌ ' + errorMessage(r.data, 'Could not send the code'), 'error'); btn.disabled = false; return; }
    email = value;
    // The server answers the same way whether or not the account exists, so
    // the wording stays neutral too.
    document.getElementById('sent_note').textContent =
      `If an account exists for ${email}, a 6-digit code is on its way. It stays valid for 10 minutes.`;
    document.getElementById('otp').value = '';
    setStep(2);
    startResendCooldown();
    if (isResend) showMessage('A new code was sent', 'info');
  } catch (e) {
    showMessage('❌ Cannot connect to server!', 'error');
  }
  btn.disabled = false;
}
document.getElementById('form1').addEventListener('submit', (e) => { e.preventDefault(); requestCode(); });
document.getElementById('resend').addEventListener('click', () => {
  document.getElementById('email').value = email;
  requestCode(true);
});
document.getElementById('back2').addEventListener('click', () => { clearInterval(resendTimer); setStep(1); });

// ── step 2: verify code ────────────────────────────────────────
document.getElementById('otp').addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
});
document.getElementById('form2').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('otp').value.trim();
  if (code.length !== 6) { showMessage('Enter the 6-digit code from your email', 'error'); return; }
  const btn = document.getElementById('btn2'); btn.disabled = true;
  try {
    const r = await call('/auth/verify-otp', { email, otp_code: code });
    if (!r.ok) { showMessage('❌ ' + errorMessage(r.data, 'Invalid code'), 'error'); btn.disabled = false; return; }
    otp = code;
    clearInterval(resendTimer);
    setStep(3);
  } catch (err) { showMessage('❌ Cannot connect to server!', 'error'); }
  btn.disabled = false;
});

// ── step 3: new password ───────────────────────────────────────
function checkRules() {
  const p = document.getElementById('new_password').value;
  const set = (id, ok) => document.getElementById(id).className = ok ? 'text-green-400' : 'text-gray-500';
  set('r_len', p.length >= 8); set('r_up', /[A-Z]/.test(p)); set('r_num', /[0-9]/.test(p));
}
document.getElementById('new_password').addEventListener('input', checkRules);
checkRules();

document.querySelectorAll('.eye').forEach(btn => {
  btn.innerHTML = EYE_ON;
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.eye);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show ? EYE_OFF : EYE_ON;
    btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    btn.setAttribute('aria-pressed', show);
  });
});

document.getElementById('form3').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('new_password').value;
  const cf = document.getElementById('confirm_password').value;
  if (!pw || !cf) { showMessage('Please fill in both fields', 'error'); return; }
  if (pw !== cf) { showMessage('Passwords do not match', 'error'); return; }
  const btn = document.getElementById('btn3'); btn.disabled = true;
  try {
    const r = await call('/auth/reset-password', { email, otp_code: otp, new_password: pw, confirm_password: cf });
    if (r.ok) {
      showMessage('✅ Password reset! Redirecting to sign in…', 'success');
      setTimeout(() => window.location.href = '/', 2000);
      return;
    }
    if (r.status === 400) {            // code expired or was used up: start over
      showMessage('❌ ' + errorMessage(r.data, 'That code is no longer valid') + ' Please request a new one.', 'error');
      setTimeout(() => { setStep(1); document.getElementById('email').value = email; }, 2200);
    } else {
      showMessage('❌ ' + errorMessage(r.data, 'Could not reset password'), 'error');
    }
  } catch (err) { showMessage('❌ Cannot connect to server!', 'error'); }
  btn.disabled = false;
});

setStep(1);
</script>
</body>
</html>
