<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Screening Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white">🔑 Reset Password</h1>
    <p class="text-gray-400 mt-2">Enter your Student ID and email to receive OTP</p>
  </div>

  <div class="bg-gray-900 rounded-2xl p-8 shadow-2xl border border-gray-800">

    <div id="message" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <!-- Step 1: Enter ID + Email -->
    <div id="step1" class="space-y-4">
      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Student ID</label>
        <input id="student_id" type="text" placeholder="e.g. 2023-2-60-148"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>
      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Email Address</label>
        <input id="email" type="email" placeholder="your@email.com"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>
      <button onclick="sendOTP()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
               py-3 rounded-lg transition duration-200">
        Send OTP to Email
      </button>
    </div>

    <!-- Step 2: Enter OTP + New Password -->
    <div id="step2" class="hidden space-y-4">
      <p class="text-green-400 text-sm text-center">
        ✅ OTP sent! Check your email inbox.
      </p>
      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Enter 6-digit OTP
        </label>
        <input id="otp" type="text" placeholder="e.g. 847291" maxlength="6"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500
                 text-center text-2xl tracking-widest"/>
      </div>
      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">New Password</label>
        <input id="new_password" type="password"
          placeholder="Min 8 chars, 1 uppercase, 1 number"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>
      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Confirm New Password
        </label>
        <input id="confirm_password" type="password" placeholder="Repeat new password"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>
      <button onclick="resetPassword()"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold
               py-3 rounded-lg transition duration-200">
        Reset Password
      </button>
    </div>

    <p class="text-center text-gray-500 text-sm mt-6">
      <a href="/" class="text-blue-400 hover:underline">← Back to Login</a>
    </p>
  </div>
</div>

<script>
const API = 'https://screening-platform-production.up.railway.app';

async function sendOTP() {
  const student_id = document.getElementById('student_id').value.trim();
  const email      = document.getElementById('email').value.trim();

  if (!student_id || !email) {
    showMessage('Please fill in all fields', 'error'); return;
  }

  try {
    showMessage('Sending OTP...', 'info');
    const res  = await fetch(`${API}/auth/forgot-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ student_id, email })
    });
    const data = await res.json();

    if (res.ok) {
      showMessage('✅ ' + data.message, 'success');
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    } else {
      showMessage('❌ ' + (data.detail || 'Failed'), 'error');
    }
  } catch {
    showMessage('❌ Cannot connect to server!', 'error');
  }
}

async function resetPassword() {
  const student_id       = document.getElementById('student_id').value.trim();
  const otp_code         = document.getElementById('otp').value.trim();
  const new_password     = document.getElementById('new_password').value;
  const confirm_password = document.getElementById('confirm_password').value;

  if (!otp_code || !new_password || !confirm_password) {
    showMessage('Please fill in all fields', 'error'); return;
  }

  try {
    showMessage('Resetting password...', 'info');
    const res  = await fetch(`${API}/auth/reset-password`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        student_id, otp_code, new_password, confirm_password
      })
    });
    const data = await res.json();

    if (res.ok) {
      showMessage('✅ ' + data.message, 'success');
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      showMessage('❌ ' + (data.detail || 'Failed'), 'error');
    }
  } catch {
    showMessage('❌ Cannot connect to server!', 'error');
  }
}

function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className   = 'mb-4 p-4 rounded-lg text-sm font-medium ';
  if (type === 'error')   el.className += 'bg-red-900 text-red-200';
  if (type === 'success') el.className += 'bg-green-900 text-green-200';
  if (type === 'info')    el.className += 'bg-blue-900 text-blue-200';
  el.classList.remove('hidden');
}
</script>
</body>
</html>
