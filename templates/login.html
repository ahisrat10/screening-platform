<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Screening Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white">🔐 Student Login</h1>
    <p class="text-gray-400 mt-2">Automated Technical Screening Platform</p>
  </div>

  <div class="bg-gray-900 rounded-2xl p-8 shadow-2xl border border-gray-800">

    <div id="message" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <div class="space-y-4">

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Student ID</label>
        <input id="student_id" type="text"
          placeholder="e.g. 2023-2-60-148"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Password</label>
        <input id="password" type="password"
          placeholder="Your password"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>

      <div class="text-right">
        <a href="forgot.html" class="text-blue-400 text-sm hover:underline">
          Forgot password?
        </a>
      </div>

      <button onclick="login()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
               py-3 rounded-lg transition duration-200">
        Login
      </button>

    </div>

    <p class="text-center text-gray-500 text-sm mt-6">
      Don't have an account?
      <a href="register.html" class="text-blue-400 hover:underline">Register here</a>
    </p>

  </div>
</div>

<script>
const API = 'https://screening-platform-production.up.railway.app';

async function login() {
  const student_id = document.getElementById('student_id').value.trim();
  const password   = document.getElementById('password').value;

  if (!student_id || !password) {
    showMessage('Please fill in all fields', 'error');
    return;
  }

  try {
    showMessage('Logging in...', 'info');

    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id, password })
    });

    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('token',      data.access_token);
      localStorage.setItem('student_id', data.student_id);
      localStorage.setItem('full_name',  data.full_name);
      localStorage.setItem('role',       data.role);

      showMessage('✅ Login successful! Redirecting...', 'success');

      setTimeout(() => {
        if (data.role === 'admin') {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 1500);

    } else {
      showMessage('❌ ' + (data.detail || 'Login failed'), 'error');
    }
  } catch (err) {
    showMessage('❌ Cannot connect to server!', 'error');
  }
}

function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className = 'mb-4 p-4 rounded-lg text-sm font-medium ';
  if (type === 'error')   el.className += 'bg-red-900 text-red-200';
  if (type === 'success') el.className += 'bg-green-900 text-green-200';
  if (type === 'info')    el.className += 'bg-blue-900 text-blue-200';
  el.classList.remove('hidden');
}
</script>
</body>
</html>
