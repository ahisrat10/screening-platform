<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Screening Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .seg-btn { transition: background-color .15s, color .15s, box-shadow .15s; }
  .seg-btn[aria-pressed="true"] { background: #2563eb; color: #fff; box-shadow: 0 1px 8px rgba(37,99,235,.45); }
  .seg-btn[aria-pressed="false"] { color: #9ca3af; }
  .seg-btn[aria-pressed="false"]:hover { color: #fff; }
</style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <div class="text-center mb-7">
    <div class="mx-auto w-14 h-14 rounded-2xl bg-blue-600/15 border border-blue-500/30 flex items-center justify-center text-2xl mb-4">🔐</div>
    <h1 id="title" class="text-2xl font-bold text-white">Student sign in</h1>
    <p class="text-gray-400 text-sm mt-1">Automated Technical Screening Platform</p>
  </div>

  <div class="bg-gray-900 rounded-2xl p-7 shadow-2xl border border-gray-800">

    <!-- Student / Teacher toggle -->
    <div class="grid grid-cols-2 gap-1 p-1 bg-gray-950 rounded-xl border border-gray-800 mb-6" role="group" aria-label="Account type">
      <button type="button" id="seg_student" class="seg-btn py-2 rounded-lg text-sm font-semibold" aria-pressed="true"  onclick="setRole('student')">🎓 Student</button>
      <button type="button" id="seg_teacher" class="seg-btn py-2 rounded-lg text-sm font-semibold" aria-pressed="false" onclick="setRole('teacher')">👩‍🏫 Teacher</button>
    </div>

    <div id="message" class="hidden mb-4 p-3 rounded-lg text-sm font-medium" role="alert"></div>

    <form id="login_form" class="space-y-4" novalidate>
      <div>
        <label for="student_id" id="id_label" class="text-gray-300 text-sm font-medium block mb-1">Student ID</label>
        <input id="student_id" type="text" autocomplete="username" autofocus
          placeholder="e.g. 2023-2-60-148"
          class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg px-4 py-3
                 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
      </div>

      <div>
        <label for="password" class="text-gray-300 text-sm font-medium block mb-1">Password</label>
        <div class="relative">
          <input id="password" type="password" autocomplete="current-password" placeholder="Your password"
            class="w-full bg-gray-800 text-white border border-gray-700 rounded-lg pl-4 pr-12 py-3
                   focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"/>
          <button type="button" id="eye" aria-label="Show password" aria-pressed="false"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-white">
            <svg id="eye_on" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.04 12.32a1 1 0 0 1 0-.64C3.42 7.5 7.36 4.5 12 4.5s8.58 3 9.96 7.18a1 1 0 0 1 0 .64C20.58 16.5 16.64 19.5 12 19.5s-8.58-3-9.96-7.18Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
            </svg>
            <svg id="eye_off" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.22A10.5 10.5 0 0 0 2.04 12c1.38 4.18 5.32 7.5 9.96 7.5 1.7 0 3.3-.44 4.7-1.22M6.23 6.23A10.45 10.45 0 0 1 12 4.5c4.64 0 8.58 3.32 9.96 7.5a10.5 10.5 0 0 1-4.29 5.23M6.23 6.23 3 3m3.23 3.23 3.65 3.65m7.89 7.89L21 21m-3.23-3.23-3.65-3.65m0 0a3 3 0 1 0-4.24-4.24m4.24 4.24L9.88 9.88"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="text-right">
        <a href="/forgot" class="text-blue-400 text-sm hover:underline">Forgot password?</a>
      </div>

      <button id="submit_btn" type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold
               py-3 rounded-lg transition duration-200">
        Sign in
      </button>
    </form>

    <p class="text-center text-gray-500 text-sm mt-6">
      Don't have an account?
      <a href="/register" class="text-blue-400 hover:underline">Register here</a>
    </p>
  </div>
</div>

<script>
const API = 'https://screening-platform-production.up.railway.app';
let role = 'student';

// ── role toggle ────────────────────────────────────────────────
function setRole(r) {
  role = r;
  document.getElementById('seg_student').setAttribute('aria-pressed', r === 'student');
  document.getElementById('seg_teacher').setAttribute('aria-pressed', r === 'teacher');
  document.getElementById('title').textContent = r === 'student' ? 'Student sign in' : 'Teacher sign in';
  document.getElementById('id_label').textContent = r === 'student' ? 'Student ID' : 'Email or login ID';
  document.getElementById('student_id').placeholder = r === 'student' ? 'e.g. 2023-2-60-148' : 'you@university.edu';
  try { localStorage.setItem('login_role', r); } catch (e) {}
  hideMessage();
}
try { const saved = localStorage.getItem('login_role'); if (saved === 'teacher') setRole('teacher'); } catch (e) {}

// ── show / hide password ───────────────────────────────────────
document.getElementById('eye').addEventListener('click', () => {
  const input = document.getElementById('password');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  document.getElementById('eye_on').classList.toggle('hidden', show);
  document.getElementById('eye_off').classList.toggle('hidden', !show);
  const b = document.getElementById('eye');
  b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  b.setAttribute('aria-pressed', show);
});

// ── submit (Enter key works because this is a real <form>) ─────
document.getElementById('login_form').addEventListener('submit', (e) => { e.preventDefault(); login(); });

async function login() {
  const student_id = document.getElementById('student_id').value.trim();
  const password   = document.getElementById('password').value;
  if (!student_id || !password) { showMessage('Please fill in all fields', 'error'); return; }

  const btn = document.getElementById('submit_btn');
  btn.disabled = true;
  try {
    showMessage('Signing in…', 'info');
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_id, password, role })
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok) {
      localStorage.setItem('token',      data.access_token);
      localStorage.setItem('student_id', data.student_id);
      localStorage.setItem('full_name',  data.full_name);
      localStorage.setItem('role',       data.role);
      showMessage('✅ Signed in! Redirecting…', 'success');
      setTimeout(() => {
        if (data.role === 'admin')        window.location.href = '/admin';
        else if (data.role === 'teacher') window.location.href = '/teacher';
        else                              window.location.href = '/student-dashboard';
      }, 600);
      return;
    }
    showMessage('❌ ' + errorMessage(data, 'Login failed'), 'error');
  } catch (err) {
    showMessage('❌ Cannot connect to server!', 'error');
  }
  btn.disabled = false;
}

// FastAPI sends `detail` as a string for HTTP errors but as an array of
// objects for validation errors. Always produce readable text.
function errorMessage(error, fallback) {
  const d = error && error.detail;
  if (typeof d === 'string' && d) return d;
  if (Array.isArray(d) && d.length) return d.map(e => (e && e.msg) ? String(e.msg).replace(/^Value error, /, '') : JSON.stringify(e)).join('; ');
  if (d && typeof d === 'object') return d.msg || d.message || JSON.stringify(d);
  if (error && error.message) return error.message;
  return fallback;
}

function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className = 'mb-4 p-3 rounded-lg text-sm font-medium ' +
    (type === 'error' ? 'bg-red-900/70 text-red-200' : type === 'success' ? 'bg-green-900/70 text-green-200' : 'bg-blue-900/70 text-blue-200');
}
function hideMessage() { document.getElementById('message').className = 'hidden'; }
</script>
</body>
</html>
