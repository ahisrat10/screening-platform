<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Screening Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white">🎓 Create Account</h1>
    <p class="text-gray-400 mt-2">Automated Technical Screening Platform</p>
  </div>

  <!-- Card -->
  <div class="bg-gray-900 rounded-2xl p-8 shadow-2xl border border-gray-800">

    <!-- Error/Success Message -->
    <div id="message" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <!-- Form -->
    <div class="space-y-4">

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Student ID
        </label>
        <input id="student_id" type="text"
          placeholder="e.g. 2023-2-60-148"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
        <p class="text-gray-500 text-xs mt-1">Format: YYYY-S-DD-RRR</p>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Full Name
        </label>
        <input id="full_name" type="text"
          placeholder="Your full name"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Email Address
        </label>
        <input id="email" type="email"
          placeholder="your@email.com"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Password
        </label>
        <input id="password" type="password"
          placeholder="Min 8 chars, 1 uppercase, 1 number"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Confirm Password
        </label>
        <input id="confirm_password" type="password"
          placeholder="Repeat your password"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500"/>
      </div>

      <button onclick="register()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
               py-3 rounded-lg transition duration-200 mt-2">
        Create Account
      </button>

    </div>

    <p class="text-center text-gray-500 text-sm mt-6">
      Already have an account?
      <a href="/" class="text-blue-400 hover:underline">Login here</a>
    </p>

  </div>
</div>

<script>
const API = 'https://screening-platform-production.up.railway.app';

async function register() {
  const student_id       = document.getElementById('student_id').value.trim();
  const full_name        = document.getElementById('full_name').value.trim();
  const email            = document.getElementById('email').value.trim();
  const password         = document.getElementById('password').value;
  const confirm_password = document.getElementById('confirm_password').value;

  if (!student_id || !full_name || !email || !password || !confirm_password) {
    showMessage('Please fill in all fields', 'error');
    return;
  }

  try {
    showMessage('Creating your account...', 'info');

    const res = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        student_id, full_name, email, password, confirm_password
      })
    });

    const data = await res.json();

    if (res.ok) {
      showMessage('✅ ' + data.message + ' Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      showMessage('❌ ' + errorMessage(data, 'Registration failed'), 'error');
    }
  } catch (err) {
    showMessage('❌ Cannot connect to server. Make sure backend is running!', 'error');
  }
}

// FastAPI sends `detail` as a string for HTTP errors but as an ARRAY of
// objects ({loc, msg, ...}) for validation errors, which used to render as
// "[object Object]". Always produce readable text.
function errorMessage(error, fallback) {
  const d = error && error.detail;
  if (typeof d === 'string' && d) return d;
  if (Array.isArray(d) && d.length) {
    return d.map(e => (e && e.msg) ? String(e.msg).replace(/^Value error, /, '') : JSON.stringify(e)).join('; ');
  }
  if (d && typeof d === 'object') return d.msg || d.message || JSON.stringify(d);
  if (error && error.message) return error.message;
  if (error && Object.keys(error).length) return JSON.stringify(error);
  return fallback;
}

function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className = 'mb-4 p-4 rounded-lg text-sm font-medium ';
  if (type === 'error')   el.className += 'bg-red-900 text-red-200';
  if (type === 'success') el.className += 'bg-green-900 text-green-200';
  if (type === 'info')    el.className += 'bg-blue-900 text-blue-200';
  el.classList.remove('hidden');
}
</script>
</body>
</html>
