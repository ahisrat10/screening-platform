<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Setup — Screening Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md">

  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-white">🛡️ Admin Setup</h1>
    <p class="text-gray-400 mt-2">Create instructor or team admin account</p>
  </div>

  <div class="bg-gray-900 rounded-2xl p-8 shadow-2xl border border-gray-800">

    <div class="bg-yellow-900 border border-yellow-700 rounded-lg p-3 mb-6">
      <p class="text-yellow-300 text-sm font-medium">
        ⚠️ Only share this page with instructors and authorized team members.
      </p>
    </div>

    <div id="message" class="hidden mb-4 p-4 rounded-lg text-sm font-medium"></div>

    <div class="space-y-4">

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Admin ID
          <span class="text-gray-500 font-normal ml-1">(student ID format)</span>
        </label>
        <input id="student_id" type="text"
          placeholder="e.g. 2023-1-00-001"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Full Name</label>
        <input id="full_name" type="text"
          placeholder="e.g. Dr. Ahmed / Instructor Name"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Email</label>
        <input id="email" type="email"
          placeholder="instructor@university.edu"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">Password</label>
        <input id="password" type="password"
          placeholder="Min 8 chars, 1 uppercase, 1 number"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Confirm Password
        </label>
        <input id="confirm_password" type="password"
          placeholder="Repeat password"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500"/>
      </div>

      <div>
        <label class="text-gray-300 text-sm font-medium block mb-1">
          Admin Secret Key
          <span class="text-gray-500 font-normal ml-1">(get from team)</span>
        </label>
        <input id="secret_key" type="password"
          placeholder="Enter secret key"
          class="w-full bg-gray-800 text-white border border-gray-700
                 rounded-lg px-4 py-3 focus:outline-none focus:border-purple-500"/>
      </div>

      <button onclick="createAdmin()"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white
               font-semibold py-3 rounded-lg transition duration-200 mt-2">
        Create Admin Account
      </button>

    </div>

    <p class="text-center text-gray-500 text-sm mt-6">
      Already have an account?
      <a href="/" class="text-blue-400 hover:underline">Login here</a>
    </p>

  </div>
</div>

<script>
const API          = 'https://screening-platform-production.up.railway.app';
const ADMIN_SECRET = 'SCREEN2024SECRET'; // Change this to your own secret!

async function createAdmin() {
  const student_id       = document.getElementById('student_id').value.trim();
  const full_name        = document.getElementById('full_name').value.trim();
  const email            = document.getElementById('email').value.trim();
  const password         = document.getElementById('password').value;
  const confirm_password = document.getElementById('confirm_password').value;
  const secret_key       = document.getElementById('secret_key').value;

  if (!student_id || !full_name || !email || !password || !confirm_password || !secret_key) {
    showMessage('Please fill in all fields', 'error'); return;
  }

  if (secret_key !== ADMIN_SECRET) {
    showMessage('Invalid secret key! Contact your team.', 'error'); return;
  }

  if (password !== confirm_password) {
    showMessage('Passwords do not match!', 'error'); return;
  }

  try {
    showMessage('Creating admin account...', 'info');

    const res  = await fetch(`${API}/auth/register-admin`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        student_id, full_name, email, password, confirm_password
      })
    });
    const data = await res.json();

    if (res.ok) {
      showMessage('✅ Admin account created! Redirecting to login...', 'success');
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      showMessage('❌ ' + (data.detail || 'Failed to create account'), 'error');
    }
  } catch {
    showMessage('❌ Cannot connect to server! Make sure backend is running.', 'error');
  }
}

function showMessage(msg, type) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.className   = 'mb-4 p-4 rounded-lg text-sm font-medium ';
  if (type === 'error')   el.className += 'bg-red-900 text-red-200';
  if (type === 'success') el.className += 'bg-green-900 text-green-200';
  if (type === 'info')    el.className += 'bg-blue-900 text-blue-200';
  el.classList.remove('hidden');
}
</script>
</body>
</html>
